<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="./libs/bootstrap-5.3.2-dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <div class="collapse navbar-collapse" style="display: flex; justify-content: center;">
        <input id="searchInput" class="form-control me-2" style="width: 50%;" placeholder="搜索文章……">
      </div>
    </div>
  </nav>
  
  <div class="row" style="margin-top:10px;">
    <div class="col-md-8" style="margin-left: 50px;">
      <div id="blogs" class="list-group">
      </div>
    </div>
    <div class="col-md-3">
      <div style="border-left:5px solid #e32c28;margin-bottom: 10px;margin-top: 25px">
        <h4 style="margin-left: 10px">分类标签</h4>
      </div>
      <div id="tags">
        <button type="button" class="btn btn-primary btn-sm" onclick="searchBlogByTag($(this))" style="margin-top:5px;margin-left:5px" title="全部分类">全部分类</button>
      </div>
    </div>
  </div>

  <script src="./libs/jquery-3.7.1.min.js"></script>
  <script src="./libs/bootstrap-5.3.2-dist/js/bootstrap.min.js"></script>
  <script src="./scripts/data.js"></script>
  <script src="./scripts/index-simple.js"></script>
  <script>
    $(function () {
      insertBlogTags()
      insertBlogTitles()
      $("#searchInput").keypress(function (e) {
        if (e.which == 13) {
          searchClick();
          return false;
        }
      });
    });
  </script>
</body>

</html>
